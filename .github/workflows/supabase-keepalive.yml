name: Supabase Keep-Alive

on:
  schedule:
    # Montags und Donnerstags um 06:00 UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch: # erlaubt manuelles Starten über den "Actions"-Tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase-Datenbank anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$SUPABASE_TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP-Status: $status"

          if [ "$status" -ne 200 ]; then
            echo "Ping fehlgeschlagen:"
            cat response.json
            exit 1
          fi

          echo "Ping erfolgreich."
